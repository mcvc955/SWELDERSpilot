//Shuffle using Fisher-Yates
function shuffle(array) {
        var currentIndex = array.length, temporaryValue, randomIndex;

        // While there remain elements to shuffle...
        while (0 !== currentIndex) {

            // Pick a remaining element...
            randomIndex = Math.floor(Math.random() * currentIndex);
            currentIndex -= 1;

            // And swap it with the current element.
            temporaryValue = array[currentIndex];
            array[currentIndex] = array[randomIndex];
            array[randomIndex] = temporaryValue;
        }

        return array;
    }

var showed_image = {
  obj_type: 'image',
  file: jsPsych.timelineVariable('fileName'),

  drawFunc: function(stimulus, canvas, context) {

    // create image manually if needed
    if (!stimulus._img) {
      stimulus._img = new Image();
      stimulus._img.src = stimulus.file;
      return; // wait until next frame
    }

    // only draw once loaded
    if (!stimulus._img.complete) {
      return;
    }

    // apply scaling factor from calibration
    let scale = pixel_factor || 1;

    let drawWidth = stimulus._img.width * scale;
    let drawHeight = stimulus._img.height * scale;

    context.drawImage(
      stimulus._img,
      canvas.width / 2 - drawWidth / 2,
      canvas.height / 2 - drawHeight / 2,
      drawWidth,
      drawHeight
    );
  }
};
