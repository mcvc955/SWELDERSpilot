// Correct practice order

let practice_errors = 0;

// PRACTICE GRID HTML
// =======================================

let practice_html = `
<div id="practice-container"
     style="
       position:relative;
       width:900px;
       height:600px;
       margin:auto;
     ">

  <p style="font-size:24px;">
    Practice Trial:<br>
    Click the buttons in this order:<br>
    <strong>1 → A → 2 → B</strong>
  </p>

  <button class="practice-btn"
          data-label="1"
          style="position:absolute; left:120px; top:120px;
                 width:70px; height:70px; border-radius:50%;">
    1
  </button>

  <button class="practice-btn"
          data-label="A"
          style="position:absolute; left:420px; top:160px;
                 width:70px; height:70px; border-radius:50%;">
    A
  </button>

  <button class="practice-btn"
          data-label="2"
          style="position:absolute; left:250px; top:320px;
                 width:70px; height:70px; border-radius:50%;">
    2
  </button>

  <button class="practice-btn"
          data-label="B"
          style="position:absolute; left:620px; top:300px;
                 width:70px; height:70px; border-radius:50%;">
    B
  </button>

  <div id="practice-feedback"
       style="
         position:absolute;
         bottom:20px;
         left:50%;
         transform:translateX(-50%);
         font-size:24px;
         color:red;
       ">
  </div>

</div>
`;


// =======================================
// PRACTICE TRIAL
// =======================================

var practice_trial = {

  type: jsPsychHtmlKeyboardResponse,

  stimulus: practice_html,

  choices: "NO_KEYS",

  on_load: function(){

    // reset counters each attempt
    practice_index = 0;
    practice_errors = 0;

    // add listeners to buttons
    document.querySelectorAll(".practice-btn")
      .forEach(function(btn){

      btn.addEventListener("click", function(){

        let clicked =
          this.dataset.label;

        let expected =
          practice_sequence[practice_index];

        // ===================================
        // CORRECT
        // ===================================

        if(clicked === expected){

          this.style.backgroundColor =
            "lightgreen";
            practice_responses.push({

              event: "correct",

              clicked_button: clicked,

              expected_button: expected,

              sequence_position: practice_index,

              correct: true,

              rt: performance.now()

            });

          practice_index++;

          // COMPLETED PRACTICE
          if(practice_index ===
             practice_sequence.length){

            document.getElementById(
              "practice-feedback"
            ).innerHTML =
              "Practice completed successfully!";

            setTimeout(function(){

              jsPsych.finishTrial({

                practice_errors:
                  practice_errors,

                passed_practice: true

              });

            }, 1000);
          }

        }

        // ===================================
        // INCORRECT
        // ===================================

        else {

          practice_errors++;

          practice_responses.push({

            event: "incorrect",

            clicked_button: clicked,

            expected_button: expected,

            sequence_position: practice_index,

            correct: false,

            rt: performance.now()

          });

          document.getElementById(
            "practice-feedback"
          ).innerHTML =
            "Incorrect sequence. Restarting practice.";

          // reset trial
          practice_index = 0;

          // reset button colors
          document.querySelectorAll(
            ".practice-btn"
          ).forEach(function(b){

            b.style.backgroundColor =
              "";
          });
        }

      });

    });

  }

};

timeline.push(practice_trial)

var TMT1 = {

  type: jsPsychHtmlKeyboardResponse,

  stimulus: function(){

    return `
    <div style="
      position:relative;
      width:900px;
      height:600px;
      margin:auto;
    ">

      ${TMT_layout1.map(node => `
        <button class="tmt-btn"
                data-label="${node.label}"
                style="
                  position:absolute;
                  left:${node.x}px;
                  top:${node.y}px;
                  width:70px;
                  height:70px;
                  border-radius:50%;
                ">
          ${node.label}
        </button>
      `).join("")}

    </div>
    `;
  },

  choices: "NO_KEYS",

  on_load: function(){

    current_index = 0;
    total_errors = 0;
    tmt_responses_tmt1 = [];

    document.querySelectorAll(".tmt-btn")
      .forEach(function(btn){

        btn.addEventListener("click", function(){

          let clicked_label = this.dataset.label;

          let expected_label =
            correct_sequence[current_index];

          // CORRECT
          if(clicked_label === expected_label){

            tmt_responses_tmt1.push({

              event: "correct",
              clicked_button: clicked_label,
              expected_button: expected_label,
              sequence_position: current_index,
              correct: true,
              rt: performance.now()

            });

            this.style.backgroundColor =
              "lightgreen";

            current_index++;

            // END TRIAL
            if(current_index ===
               correct_sequence.length){

              jsPsych.finishTrial({

                completed: true,
                total_errors: total_errors,
                responses: tmt_responses_tmt1

              });
            }

          }

          // INCORRECT
          else {

            total_errors++;

            tmt_responses_tmt1.push({

              event: "incorrect",
              clicked_button: clicked_label,
              expected_button: expected_label,
              sequence_position: current_index,
              correct: false,
              total_errors: total_errors,
              rt: performance.now()

            });

            this.style.backgroundColor =
              "salmon";
          }

        });

      });

  }

};
timeline.push(TMT1);
