function saveData(filename, csv) {
  console.log('Saving data with filename:', filename);
  console.log('CSV length:', csv ? csv.length : 'No CSV data');
  
  fetch(GOOGLE_SCRIPT_URL, {
    method: "POST",
    mode: "no-cors",
    body: JSON.stringify({
      filename: filename,
      csv: csv
    })
  })
  .then(res => {
    console.log('Upload sent successfully');
    alert('Data saved successfully! Filename: ' + filename);
  })
  .catch(err => {
    console.error('Save failed:', err);
    alert('Error saving data: ' + err.message);
  });
}

var jsPsych = initJsPsych({

  override_safe_mode: true,
  show_progress_bar: true,
  on_finish: function(){
    // Extract participant ID from the ID trial
    const idTrial = jsPsych.data.get().filter({ test_part: 'id' }).values()[0];
    console.log('ID Trial:', idTrial);
    console.log('ID Trial Response:', idTrial?.response);
    
    let ptc_id = 'unknown';
    
    if (idTrial && idTrial.response) {
      // Handle both object and string responses
      if (typeof idTrial.response === 'object') {
        console.log('Response is object:', idTrial.response);
        ptc_id = idTrial.response.participant_id || idTrial.response['participant id'] || 'unknown';
      } else if (typeof idTrial.response === 'string') {
        console.log('Response is string:', idTrial.response);
        try {
          const parsed = JSON.parse(idTrial.response);
          ptc_id = parsed.participant_id || parsed['participant id'] || 'unknown';
        } catch(e) {
          ptc_id = idTrial.response;
        }
      }
    }
    
    console.log('Extracted participant_id:', ptc_id);
    const filename = "SWELDERS_16_Session1_" + ptc_id + "_" + Date.now();
    console.log('Final filename:', filename);
    saveData(filename, jsPsych.data.get().csv());
  }
});

return `

display: grid;
grid-template-columns: repeat(4, 1fr);
gap: 20px;
justify-items: center;
align-items: center;
">

`;
