    // reset counters each attempt
    practice_index = 0;
    practice_errors = 0;

    document.querySelectorAll(".practice-btn")
      .forEach(function(btn){

      btn.addEventListener("click", function(){

        let clicked =
          this.dataset.label;

        let expected =
          practice_sequence[practice_index];

        // ===================================
        // CORRECT
        // ===================================

        if(clicked === expected){

          this.style.backgroundColor =
            "lightgreen";
            practice_responses.push({

              event: "correct",

              clicked_button: clicked,

              expected_button: expected,

              sequence_position: practice_index,

              correct: true,

              rt: performance.now()

            });

          practice_index++;

          // COMPLETED PRACTICE
          if(practice_index ===
             practice_sequence.length){

            document.getElementById(
              "practice-feedback"
            ).innerHTML =
              "Practice completed successfully!";

            setTimeout(function(){

              jsPsych.finishTrial({

                practice_errors:
                  practice_errors,

                passed_practice: true

              });

            }, 1000);
          }

        }

        // ===================================
        // INCORRECT
        // ===================================

        else {

          practice_errors++;

          practice_responses.push({

            event: "incorrect",

            clicked_button: clicked,

            expected_button: expected,

            sequence_position: practice_index,

            correct: false,

            rt: performance.now()

          });

          document.getElementById(
            "practice-feedback"
          ).innerHTML =
            "Incorrect sequence. Restarting practice.";

          // reset trial

          // reset button colors

            ".practice-btn"
