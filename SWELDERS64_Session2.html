  "https://script.google.com/macros/s/AKfycbyzRSkOmjZk5vdQJgKJl3Q7CjyC8v2WduYAYF2cOzrGxx9EVzSl8Ng9noyDrOrJZQiI7A/exec";

function saveData(filename, csv) {
  console.log('Saving data with filename:', filename);
  console.log('CSV length:', csv ? csv.length : 'No CSV data');
  
  fetch(GOOGLE_SCRIPT_URL, {
    method: "POST",
    mode: "no-cors",
    body: JSON.stringify({
      filename: filename,
      csv: csv
    })
  })
  .then(res => {
    console.log('Upload sent successfully');
    alert('Data saved successfully! Filename: ' + filename);
  })
  .catch(err => {
    console.error('Save failed:', err);
    alert('Error saving data: ' + err.message);
  });
}

var jsPsych = initJsPsych({

  override_safe_mode: true,
  show_progress_bar: true,

  on_finish: function() {

    const idTrial =
      jsPsych.data.get()
        .filter({ test_part: 'id' })
        .values()[0];

    console.log('=== PARTICIPANT ID EXTRACTION DEBUG ===');
    console.log('Full idTrial object:', idTrial);
    console.log('idTrial.response:', idTrial?.response);
    console.log('response type:', typeof idTrial?.response);
    if (idTrial?.response && typeof idTrial.response === 'object') {
      console.log('response keys:', Object.keys(idTrial.response));
      console.log('response entries:', Object.entries(idTrial.response));
    }

    let ptc_id = "unknown";

    if (idTrial) {
      if (idTrial.response && typeof idTrial.response === "object") {
        console.log('Response is object, checking properties...');
        console.log('participant_id:', idTrial.response.participant_id);
        console.log('participant id:', idTrial.response["participant id"]);
        ptc_id =
          idTrial.response.participant_id ||
          idTrial.response["participant id"] ||
          Object.values(idTrial.response)[0] ||
          "unknown";
      } else if (typeof idTrial.response === "string") {
        console.log('Response is string, attempting JSON.parse...');
        try {
          const parsed = JSON.parse(idTrial.response);
          console.log('Parsed successfully:', parsed);
          ptc_id =
            parsed.participant_id ||
            parsed["participant id"] ||
            Object.values(parsed)[0] ||
            "unknown";
        } catch (e) {
          console.warn("Could not parse participant ID response:", e);
          ptc_id = idTrial.response;
        }
      }
    }

    console.log('Final extracted ptc_id:', ptc_id);
    console.log('=====================================');

    const filename =
      "SWELDERS_64_Session2_" +
      ptc_id +
      "_" +
      Date.now();

    console.log('Final filename:', filename);
    saveData(
      filename,
      jsPsych.data.get().csv()
    );
  }

                completed: true,
                total_errors: total_errors,
                responses: tmt_responses_tmt2

              expected_button: expected_label,

      });

  }
