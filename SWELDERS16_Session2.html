    return `
    <div class="tmt-wrapper">

                  top:${node.y}px;
                  width:70px;

                  border-radius:50%;

        </button>

    </div>
    `;
  },

  choices: "NO_KEYS",

  on_load: function(){
    const board =
  document.getElementById("tmt-board");

const scaleX =
  window.innerWidth / 1000;

const scaleY =
  window.innerHeight / 800;

const scale =
  Math.min(scaleX, scaleY, 1);

  `scale(${scale})`;

    current_index = 0;
    total_errors = 0;
    tmt_responses_tmt1 = [];

      .forEach(function(btn){

          let clicked_label = this.dataset.label;

            correct_sequence[current_index];

          if(clicked_label === expected_label){

            tmt_responses_tmt1.push({

              event: "correct",
              clicked_button: clicked_label,
              expected_button: expected_label,
              sequence_position: current_index,
              correct: true,
              rt: performance.now()

            });

              "lightgreen";

            current_index++;

            // END TRIAL
            if(current_index ===
               correct_sequence.length){

              jsPsych.finishTrial({

                completed: true,
                total_errors: total_errors,
                responses: tmt_responses_tmt1

              expected_button: expected_label,

              total_errors: total_errors,
              rt: performance.now()

var facename_baselinetest = {

  type: jsPsychSurveyHtmlForm,

  html: function(){

  let current =

  let first_letter =

  // reset hint tracking EACH trial
  hint_used = false;
  hint_count = 0;

  return `

    <div style="text-align:center;">

      <button
        type="button"
        id="hint-btn"
        style="
          font-size:18px;
          padding:8px 14px;
          margin-bottom:20px;

        type="text"
        autocomplete="off"
        required
        style="
          font-size:20px;
          padding:5px;
        "
      >

    </div>

  `;
},

  button_label: "Next",

  on_load: function(){

    let current =
      allfaceswithdata_shuffled_fortest2[0];

    let first_letter =
      current.answer.charAt(0);

    document
      .getElementById("hint-btn")
      .addEventListener("click", function(){

        hint_used = true;

        hint_count++;

        alert(
          `Hint: The first letter is "${first_letter}"`
        );

      });

  },

  on_finish: function(data){

    let f =
      allfaceswithdata_shuffled_fortest2.shift();

    let typed =
      data.response.response
        .trim()
        .toLowerCase();

    let correct =
      f.answer
        .trim()
        .toLowerCase();

    // =========================
    // SAVE DATA
    // =========================

    data.correct =
      (typed === correct);

    data.correct_answer =
      f.answer;

    data.face_image =
      f.image;

    data.hint_used =
      hint_used;

    data.hint_count =
      hint_count;

    // =========================
    // REINSERT IF WRONG
    // =========================

    if(!data.correct){

      let rand_index =
        Math.floor(
          Math.random() *
          (allfaceswithdata_shuffled_fortest2.length + 1)
        );

      allfaceswithdata_shuffled_fortest2.splice(
        rand_index,
        0,
        f
      );

    }

  }

};
